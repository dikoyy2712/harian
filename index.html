<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajer Keuangan Harian Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ec4b6;
            --danger: #e71d36;
            --dark: #011627;
            --light: #f8f9fa;
            --bg: #eef2f5;
            --card-bg: #ffffff;
            --shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--dark);
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        h2.title {
            text-align: center;
            margin-top: 0;
            font-weight: 700;
            font-size: 24px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .card {
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            color: white;
        }

        .card.balance {
            grid-column: span 2;
            background: linear-gradient(135deg, var(--primary), #3f37c9);
        }

        .card.income { background-color: var(--success); }
        .card.expense { background-color: var(--danger); }

        .card small { font-size: 12px; opacity: 0.9; }
        .card h3 { margin: 5px 0 0 0; font-size: 22px; font-weight: 600; }

        .form-container {
            background: var(--light);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }

        .form-container h4 {
            margin: 0 0 15px 0;
            font-size: 15px;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #6c757d;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            border: 1.5px solid #dee2e6;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        button.btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        button.btn-submit:hover { opacity: 0.9; }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .history-header h4 { margin: 0; font-weight: 600; }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
        }

        li {
            background: var(--light);
            margin-bottom: 10px;
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info strong { display: block; font-size: 14px; }
        .item-info small { font-size: 11px; color: #6c757d; }

        .item-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .amount { font-weight: 600; font-size: 14px; }
        .amount.masuk { color: var(--success); }
        .amount.keluar { color: var(--danger); }

        .btn-delete {
            background: none;
            border: none;
            color: #adb5bd;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-delete:hover { color: var(--danger); }

        .btn-reset {
            width: 100%;
            background: transparent;
            border: 1px dashed var(--danger);
            color: var(--danger);
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="title">💰 Catatan Keuangan</h2>

        <!-- Ringkasan Saldo -->
        <div class="dashboard">
            <div class="card balance">
                <small>Sisa Saldo Anda</small>
                <h3 id="tampilSaldo">Rp 0</h3>
            </div>
            <div class="card income">
                <small>Total Pemasukan</small>
                <h3 id="tampilPemasukan">Rp 0</h3>
            </div>
            <div class="card expense">
                <small>Total Pengeluaran</small>
                <h3 id="tampilPengeluaran">Rp 0</h3>
            </div>
        </div>

        <!-- Form Tambah Transaksi -->
        <div class="form-container">
            <h4>✍️ Catat Transaksi / Saldo</h4>
            <div class="form-group">
                <label>Jenis Transaksi</label>
                <select id="jenisTransaksi">
                    <option value="keluar">💸 Pengeluaran (-)</option>
                    <option value="masuk">➕ Pemasukan / Isi Saldo (+)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Keterangan</label>
                <input type="text" id="ketTransaksi" placeholder="Cth: Makan Siang, Gaji, Isi Saldo">
            </div>
            <div class="form-group">
                <label>Nominal (Rp)</label>
                <input type="text" id="jumlahTransaksi" placeholder="Cth: 50.000 atau 200.000">
            </div>
            <button class="btn-submit" onclick="tambahTransaksi()">Simpan Transaksi</button>
        </div>

        <!-- Riwayat Transaksi -->
        <div class="history-section">
            <div class="history-header">
                <h4>📜 Riwayat Transaksi</h4>
            </div>
            <ul id="daftarTransaksi"></ul>
        </div>

        <button class="btn-reset" onclick="hapusSemuaData()">Reset Semua Data</button>
    </div>

    <script>
        let transaksi = JSON.parse(localStorage.getItem('transaksi_v3')) || [];

        const formatRupiah = (angka) => 'Rp ' + angka.toLocaleString('id-ID');

        const parseInput = (str) => {
            if (!str) return 0;
            return parseInt(str.toString().replace(/\./g, '').replace(/,/g, '')) || 0;
        };

        function updateTampilan() {
            let totalMasuk = 0;
            let totalKeluar = 0;

            const list = document.getElementById('daftarTransaksi');
            list.innerHTML = '';

            if (transaksi.length === 0) {
                list.innerHTML = `<li style="justify-content: center; color: #adb5bd; font-size: 13px;">Belum ada transaksi recorded.</li>`;
            } else {
                transaksi.forEach((t, index) => {
                    if (t.jenis === 'masuk') totalMasuk += t.jumlah;
                    else totalKeluar += t.jumlah;

                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div class="item-info">
                            <strong>${t.ket}</strong>
                            <small>${t.tgl}</small>
                        </div>
                        <div class="item-right">
                            <span class="amount ${t.jenis}">${t.jenis === 'masuk' ? '+' : '-'}${formatRupiah(t.jumlah)}</span>
                            <button class="btn-delete" onclick="hapusSatuTransaksi(${index})">❌</button>
                        </div>
                    `;
                    list.appendChild(li);
                });
            }

            const sisaSaldo = totalMasuk - totalKeluar;

            document.getElementById('tampilSaldo').innerText = formatRupiah(sisaSaldo);
            document.getElementById('tampilPemasukan').innerText = formatRupiah(totalMasuk);
            document.getElementById('tampilPengeluaran').innerText = formatRupiah(totalKeluar);

            localStorage.setItem('transaksi_v3', JSON.stringify(transaksi));
        }

        function tambahTransaksi() {
            const jenis = document.getElementById('jenisTransaksi').value;
            const ketInput = document.getElementById('ketTransaksi').value;
            const jumlahInput = document.getElementById('jumlahTransaksi').value;
            
            const jumlah = parseInput(jumlahInput);
            const ket = ketInput.trim() === '' ? (jenis === 'masuk' ? 'Pemasukan / Saldo' : 'Pengeluaran') : ketInput.trim();

            if (jumlah <= 0) {
                alert('Silakan masukkan nominal angka yang benar!');
                return;
            }

            // Peringatan jika pengeluaran melebihi sisa saldo saat ini
            let totalMasuk = 0, totalKeluar = 0;
            transaksi.forEach(t => {
                if (t.jenis === 'masuk') totalMasuk += t.jumlah;
                else totalKeluar += t.jumlah;
            });
            const sisaSaldoSaatIni = totalMasuk - totalKeluar;

            if (jenis === 'keluar' && jumlah > sisaSaldoSaatIni) {
                if (!confirm('⚠️ Peringatan: Pengeluaran melebihi sisa saldo Anda! Lanjutkan menyimpan?')) {
                    return;
                }
            }

            const sekarang = new Date();
            const tgl = sekarang.toLocaleDateString('id-ID') + ' ' + sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            transaksi.unshift({ jenis, ket, jumlah, tgl });

            document.getElementById('ketTransaksi').value = '';
            document.getElementById('jumlahTransaksi').value = '';

            updateTampilan();
        }

        function hapusSatuTransaksi(index) {
            transaksi.splice(index, 1);
            updateTampilan();
        }

        function hapusSemuaData() {
            if (confirm('Apakah Anda yakin ingin menghapus seluruh data transaksi?')) {
                transaksi = [];
                localStorage.removeItem('transaksi_v3');
                updateTampilan();
            }
        }

        updateTampilan();
    </script>
</body>
</html>
